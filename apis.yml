name: Loews Corporation
description: |-
  Loews Corporation (NYSE: L) is a diversified holding company headquartered at
  9 West 57th Street, New York. Controlled by the Tisch family, the corporation
  pursues long-term shareholder value through four operating subsidiaries spanning
  insurance, energy infrastructure, hospitality, and rigid plastic packaging.
  The parent entity itself publishes no developer APIs, SDKs, or technical
  artifacts — its public surface is investor-relations, SEC filings, and press
  communications. This apis.yml therefore documents the parent's portfolio
  structure and points to each operating subsidiary for any API-bearing surface.

